name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main, claude/manga-reader-web-port-tun5gh]
  workflow_dispatch:

# contents: para publicar la rama gh-pages; pages: para pedir el rebuild.
permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # La app se sirve bajo /<repo>/ en GitHub Pages.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Evita que GitHub Pages procese la salida con Jekyll.
      - run: touch dist/.nojekyll

      # Publica el contenido de dist/ en la rama gh-pages con un push directo.
      - name: Publicar en gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Los pushes del bot a gh-pages NO disparan un rebuild de Pages por sí solos.
      # Lo pedimos explícitamente para que la CDN publique la versión recién subida.
      - name: Solicitar rebuild de GitHub Pages
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")
          echo "POST /pages/builds -> HTTP $code"
          # 201 = build encolado. No fallar el job si Pages tarda en responder.
          test "$code" = "201" || echo "Aviso: respuesta inesperada ($code), Pages puede reconstruir igualmente."
        env:
          GITHUB_TOKEN: ${{ github.token }}
